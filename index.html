<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Precio de Circuito</title>
  <style>
:root{
  --bg:#0b1220; --surface:#121a2c; --surface-2:#182338; --surface-3:#0e1728;
  --border:#243050; --text:#e8edf7; --text-dim:#8b98b3;
  --teal:#2dd4bf; --teal-dim:rgba(45,212,191,.13);
  --copper:#eba454; --green:#3ee08a; --green-dim:rgba(62,224,138,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh}
.app{width:100%;max-width:760px;margin:0 auto;padding:16px 12px 24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.top h1{font-size:18px;margin:0;font-weight:800}
.top p{margin:3px 0 0;color:var(--text-dim);font-size:12px}
.brand{display:flex;align-items:center;gap:9px}
.brand-dot{width:9px;height:9px;border-radius:2px;background:var(--teal);box-shadow:0 0 8px var(--teal-dim);flex:none}
.actions{display:flex;gap:8px}
.reset,.admin{border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--text-dim);font-weight:700;font-size:12px;padding:9px 13px}
.admin{border-color:var(--teal);color:var(--teal)}
.table{width:100%;overflow:hidden;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.row{display:grid;grid-template-columns:minmax(0,40%) 16% 22% 22%;min-height:44px}
.row>div{border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;padding:2px 4px}
.header{background:var(--surface-3);font-weight:700;font-size:10.5px;min-height:38px;color:var(--text-dim)}
.header>div{border-bottom:1px solid var(--border)}
.component{font-size:12px;font-weight:600;padding:8px 10px;justify-content:flex-start!important;text-align:left}
.price{font-size:12px;color:var(--text-dim)}
.price-input{width:90%;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface-3);color:var(--text);text-align:center;font-size:14px;font-weight:700}
.name-input{width:100%;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--surface-3);color:var(--text);font-size:11px;padding:0 6px}
.qty input{width:100%;height:34px;border:1px solid var(--border);border-radius:7px;background:var(--surface-3);color:var(--text);text-align:center;font-size:16px;font-weight:700;outline:none}
.total{font-size:13px;font-weight:800;color:var(--teal)}
.delete-col{display:none}
body.is-admin .delete-col{display:flex}
.danger{border:1px solid #ef4444;background:#dc2626;color:#fff;border-radius:7px;padding:5px 8px;font-weight:800}
.admin-zone{display:none;padding:12px;gap:9px;flex-wrap:wrap;border-top:1px solid var(--border)}
body.is-admin .admin-zone{display:flex}
.admin-zone button{border:1px solid var(--teal);border-radius:9px;background:transparent;color:var(--teal);padding:9px 12px;font-weight:700}
.receipt{border-top:1px solid var(--border)}
.summary{display:grid;grid-template-columns:8px 1fr auto;align-items:stretch;min-height:48px;background:var(--surface-3);border-bottom:1px solid var(--border)}
.summary-bar{background:var(--border)}
.summary-label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--text-dim);padding:0 12px}
.summary-value{display:flex;align-items:center;justify-content:flex-end;font-weight:800;font-size:15px;padding:0 12px;white-space:nowrap}
.mayor .summary-bar{background:var(--copper)} .mayor .summary-label{color:#f0b876}
.cobrar{background:var(--green-dim)} .cobrar .summary-bar{background:var(--green)} .cobrar .summary-label{color:var(--green)} .cobrar .summary-value{color:var(--green);font-size:18px}
.multiplier{display:none;gap:6px;align-items:center} body.is-admin .multiplier{display:flex}
.multiplier input{width:50px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:#fff;text-align:center}
.offline{text-align:center;color:var(--text-dim);font-size:11px;margin:14px 0 0}
#login{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:#000b}
.login-box{width:min(340px,100%);padding:22px;border:1px solid #39465d;border-radius:18px;background:#172238}
.login-box input{width:100%;margin:6px 0;padding:13px;border-radius:10px;border:1px solid var(--border);background:var(--surface-3);color:#fff}
.login-actions{display:flex;gap:8px;margin-top:12px} .login-actions button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--teal);color:var(--teal);background:transparent;font-weight:700}
.hint{color:#fca5a5;font-size:13px;min-height:17px}
@media(max-width:430px){ .row{grid-template-columns:38% 16% 23% 23%} .app{padding:12px 8px} }
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand"><span class="brand-dot"></span><div><h1>PRECIO DE CIRCUITO</h1><p>Calculadora de materiales</p></div></div>
      <div class="actions"><button id="adminBtn" class="admin" type="button">ADMIN</button><button id="resetBtn" class="reset" type="button">LIMPIAR</button></div>
    </header>
    <section class="table">
      <div class="row header"><div>COMPONENTE</div><div>PRECIO</div><div>CANTIDAD</div><div>TOTAL</div><div class="delete-col">X</div></div>
      <div id="rows"></div>
      <div class="admin-zone"><button id="addBtn" type="button">+ AGREGAR</button><button id="saveBtn" type="button">GUARDAR CAMBIOS</button></div>
      <div class="receipt">
        <div class="summary"><div class="summary-bar"></div><div class="summary-label">PRECIO TOTAL</div><div id="grandTotal" class="summary-value">0</div></div>
        <div class="summary mayor"><div class="summary-bar"></div><div class="summary-label">POR MAYOR <span class="multiplier">x <input id="wholesaleMult" type="number" step="0.1"></span></div><div id="wholesaleTotal" class="summary-value">0</div></div>
        <div class="summary cobrar"><div class="summary-bar"></div><div class="summary-label">AL PÚBLICO <span class="multiplier">x <input id="publicMult" type="number" step="0.1"></span></div><div id="chargeTotal" class="summary-value">0</div></div>
      </div>
    </section>
    <p class="offline"><span style="color:var(--teal)">●</span> Aplicación local · funciona sin Internet</p>
  </main>
<div id="login"><div class="login-box"><h2>Acceso administrador</h2><input id="username" placeholder="Usuario"><input id="password" type="password" placeholder="Clave"><div class="hint" id="loginError"></div><div class="login-actions"><button id="loginBtn">ENTRAR</button><button id="closeLoginBtn" class="reset">CERRAR</button></div></div></div>
<script>
const DEFAULT_ITEMS = [["PORTAPILAS",2],["INTERRUPTOR",1],["INTERRUPTOR (3patas)",3],["LED",0.5],["MOTOR RF -310T(5.9v)",6],["MOTOR DC (130)",6],["MOTOR MABUCHI (9v)",9],["MOTOR MABUCHI MMN (8v)",10],["MOTOR - BOMBA DE AGUA",9],["PANEL - Bajo",12],["PANEL - Medio",15],["BROCHE PARA BATERIA",2],["CABLE",0.5],["MANGUERA (VENOCLISIS)",1],["JERINGA",0.3],["BATERIA TOSHIBA",7],["BATERIA DURACELL",17],["PILA PANASONIC",2],["PILA DURACELL",7],["DIODO",0.2],["RESISTENCIA",0.2]];
const STORAGE_KEY="precio_circuito_pwa_v1";
let isAdmin=false; let quantities={};
function loadConfig(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)); if(s&&Array.isArray(s.items)) return {items:s.items, wholesale:s.wholesale??2.3, public:s.public??2.7}}catch(e){} return {items:DEFAULT_ITEMS.map(x=>[...x]), wholesale:2.3, public:2.7}}
let config=loadConfig();
const $=id=>document.getElementById(id);
const money=n=>(Number.isFinite(n)?n:0).toLocaleString("es-PE",{minimumFractionDigits:0,maximumFractionDigits:2});
function render(){
  document.body.classList.toggle("is-admin",isAdmin);
  $("adminBtn").textContent=isAdmin?"SALIR":"ADMIN";
  $("wholesaleMult").value=config.wholesale; $("publicMult").value=config.public;
  $("rows").innerHTML=config.items.map((it,i)=>`
    <div class="row">
      <div class="component">${isAdmin?`<input class="name-input" data-name="${i}" value="${it[0]}">`:`${it[0]}`}</div>
      <div class="price">${isAdmin?`<input class="price-input" data-price="${i}" type="number" step="0.1" value="${it[1]}">`:`${it[1]}`}</div>
      <div class="qty"><input data-qty="${i}" type="number" inputmode="decimal" placeholder="0" value="${quantities[i]||""}"></div>
      <div class="total" id="t${i}">0</div>
      ${isAdmin?`<div class="delete-col"><button class="danger" data-del="${i}">X</button></div>`:""}
    </div>`).join("");
  $("rows").querySelectorAll("[data-qty]").forEach(el=>el.addEventListener("input",calculate));
  $("rows").querySelectorAll("[data-price]").forEach(el=>el.addEventListener("input",()=>{config.items[+el.dataset.price][1]=Math.max(0,Number(el.value)||0); calculate()}));
  $("rows").querySelectorAll("[data-name]").forEach(el=>el.addEventListener("input",()=>{config.items[+el.dataset.name][0]=el.value}));
  $("rows").querySelectorAll("[data-del]").forEach(el=>el.addEventListener("click",()=>{if(confirm(`¿Eliminar "${config.items[+el.dataset.del][0]}"?`)){config.items.splice(+el.dataset.del,1); quantities={}; render()}}));
  $("wholesaleMult").oninput=e=>{config.wholesale=Math.max(0,Number(e.target.value)||0); calculate()};
  $("publicMult").oninput=e=>{config.public=Math.max(0,Number(e.target.value)||0); calculate()};
  calculate();
}
function calculate(){
  let sum=0; config.items.forEach((it,i)=>{
    const q=Number(document.querySelector(`[data-qty="${i}"]`)?.value||0);
    const p=Number(it[1])||0; const sub=q*p; sum+=sub;
    const el=document.getElementById(`t${i}`); if(el) el.textContent=money(sub);
    quantities[i]=q;
  });
  $("grandTotal").textContent=money(sum);
  $("wholesaleTotal").textContent=money(sum*config.wholesale);
  $("chargeTotal").textContent=money(sum*config.public);
}
function saveConfig(){
  document.querySelectorAll("[data-name]").forEach(el=>config.items[+el.dataset.name][0]=el.value.trim()||"NUEVO");
  document.querySelectorAll("[data-price]").forEach(el=>config.items[+el.dataset.price][1]=Math.max(0,Number(el.value)||0));
  localStorage.setItem(STORAGE_KEY,JSON.stringify(config));
  alert("¡Cambios guardados!");
}
function openLogin(){$("loginError").textContent="";$("username").value="";$("password").value="";$("login").style.display="flex";$("username").focus()}
function closeLogin(){$("login").style.display="none"}
function login(){const u=$("username").value.trim().toLowerCase(); const p=$("password").value.trim(); if(u==="inventa"&&p==="inventa123"){isAdmin=true;closeLogin();render()}else{$("loginError").textContent="Usuario o clave incorrectos."}}
$("adminBtn").addEventListener("click",()=>{if(isAdmin){saveConfig(); isAdmin=false; render()}else openLogin()});
$("loginBtn").addEventListener("click",login);
$("closeLoginBtn").addEventListener("click",closeLogin);
$("password").addEventListener("keydown",e=>{if(e.key==="Enter") login()});
$("addBtn").addEventListener("click",()=>{config.items.push(["NUEVO COMPONENTE",0]); render()});
$("saveBtn").addEventListener("click",saveConfig);
$("resetBtn").addEventListener("click",()=>{if(confirm("¿Limpiar cantidades?")){quantities={}; document.querySelectorAll("[data-qty]").forEach(el=>el.value=""); calculate()}});
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body>
</html>
